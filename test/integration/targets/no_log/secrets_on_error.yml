- hosts: testhost
  gather_facts: false
  vars_files:
      - secretvars.yml
  tasks:
    - name: force error, but hide secret
      block:
      - name: string is not boolean
        debug:
          msg: dont show secret
        when: s101
        no_log: true
      - name: string is not boolean
        debug:
          msg: dont show secret
        when: s101
        no_log: '{{no_log_var}}'
        vars:
          no_log_var: '{{ 1 == 1 }}'
      rescue:
      - debug:
          msg: alwasy rescue, but should not see secret
